
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jenkins CI/CD Project</title>
</head>
<body>
    <h1>Hello from GitHub and Jenkins!</h1>
    <p>Automatic build, deployment and testing successful.</p>

    <h1>My first automatic Jenkins deployment!</h1>

    <hr>

    <h2>Current Date and Time</h2>
    <p id="datetime"></p>

    <script>
        function updateDateTime() {
            const now = new Date();

            document.getElementById("datetime").textContent =
                now.toLocaleString("en-IN", {
                    timeZone: "Asia/Kolkata",
                    dateStyle: "full",
                    timeStyle: "medium"
                });
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
